[env]
TERM = "xterm-256color"

[window]
# NOTE:: The `Buttonless` option allows for a minimal UI, but native macOS tabs are not compatible with a
#        buttonless window. Furthermore, the alacritty maintainers have made it very clear they will never 
#        (ever, ever, ever) support tabs. So... until we can be bothered to learn tmux, we're going to have
#        to keep this disabled.
#
#        Keybindings:
#         - New Tab: ⌘  + t
#         - Close Tab: ⌘  + w
#         - Tab Right: ⌘  + ⇧  + ]
#         - Tab Left: ⌘  + ⇧  + [
#
#   REF: macOS tabs - https://support.apple.com/en-gb/guide/mac-help/mchla4695cce/mac
#
# decorations = "Buttonless"
startup_mode = "Maximized"
option_as_alt = "Both"

[keyboard]

[[keyboard.bindings]]
key = "3"
mods = "Option"
chars = "#"

[font]
normal.family = "CaskaydiaCove Nerd Font"
normal.style = "Regular"
size = 14

[general]
# NOTE: The second import holds machine-specific settings written by
#       https://github.com/justJackjon/local-machine-config (e.g. Mac-style key bindings in WSL's XFCE
#       session). Alacritty skips missing imports, so machines without it are unaffected.
import = [
  "~/.config/alacritty/themes/themes/dracula.toml",
  "~/.config/local-machine-config/alacritty.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
